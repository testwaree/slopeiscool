<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Slope Game Hub</title>
  <link rel="stylesheet" href="styles.css"> <!-- External CSS -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap">
</head>
<body>
  <div id="app">
    <!-- Sidebar Navigation -->
    <nav class="sidebar">
      <div class="sidebar-header">
        <h2>Slope Hub</h2>
      </div>
      <ul class="sidebar-menu">
        <li><a href="#" class="active"><span class="icon">🏠</span> Home</a></li>
        <li><a href="#"><span class="icon">📚</span> Library</a></li>
        <li><a href="#"><span class="icon">⭐</span> Favorites</a></li>
        <li><a href="#"><span class="icon">⚙️</span> Settings</a></li>
        <li><a href="#"><span class="icon">❓</span> Help</a></li>
      </ul>
    </nav>

    <!-- Main Content -->
    <main class="content">
      <!-- Game Display Section -->
      <section class="game-display">
        <div class="game-info">
          <h1 id="game-title">Slope 2015</h1>
          <p id="game-description">The original version of the legendary browser game Slope! Play the classic that started it all.</p>
          <div class="game-actions">
            <button id="play-game">Play Now</button>
          </div>
        </div>
        <div class="game-thumbnail">
          <img src="https://via.placeholder.com/128" alt="Slope 2015" id="game-thumbnail">
        </div>
      </section>

      <!-- Other Versions Section -->
      <section class="game-versions">
        <h2>Other Versions</h2>
        <div class="versions-grid">
          <!-- Game Cards -->
          <div class="game-card" data-version="2015">
            <img src="https://via.placeholder.com/128" alt="Slope 2015">
            <h3>Slope 2015</h3>
            <span class="favorite-icon">⭐</span>
          </div>
          <div class="game-card" data-version="2016">
            <img src="https://via.placeholder.com/128" alt="Slope 2016">
            <h3>Slope 2016</h3>
            <span class="favorite-icon">⭐</span>
          </div>
          <div class="game-card" data-version="unblocked">
            <img src="https://via.placeholder.com/128" alt="Slope Unblocked">
            <h3>Slope Unblocked</h3>
            <span class="favorite-icon">⭐</span>
          </div>
          <!-- Add more game cards here -->
        </div>
      </section>
    </main>
  </div>

  <script src="script.js"></script> <!-- External JS -->
</body>
</html>
